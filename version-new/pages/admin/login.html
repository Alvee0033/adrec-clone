<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Login | ADREC Admin Portal</title>
  <link rel="stylesheet" href="/src/styles/style.css" />
  <link rel="stylesheet" href="/src/styles/admin.css" />
  <link rel="icon" href="/assets/icons/logo-dark.svg" type="image/svg+xml" />
  <style>
    /* Full-screen dark luxury theme background for login only (no headers/footers) */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at 10% 20%, #151c18 0%, #0a0e0b 90%);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(26, 36, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 40px;
      box-sizing: border-box;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      height: 52px;
      margin-bottom: 20px;
      filter: drop-shadow(0 2px 10px rgba(170, 188, 169, 0.2));
    }

    .login-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #F3F4F6;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 0.88rem;
      color: #9CA3AF;
      margin-bottom: 30px;
    }

    .form-group label {
      color: #D1D5DB;
      font-size: 13px;
      font-weight: 500;
    }

    .form-group input {
      background: rgba(17, 24, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #F9FAFB;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #AABCA9;
      box-shadow: 0 0 0 2px rgba(170, 188, 169, 0.15);
      background: rgba(17, 24, 20, 0.95);
    }

    .btn-login {
      margin-top: 10px;
      background: #AABCA9;
      color: #0c110e;
      font-weight: 600;
      padding: 14px;
      font-size: 15px;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(170, 188, 169, 0.2);
    }

    .btn-login:hover {
      background: #c3d4c2;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(170, 188, 169, 0.3);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #F87171;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header" style="text-align: center;">
        <img src="/assets/icons/logo-dark.svg" alt="ADREC Logo" class="login-logo" />
        <h2>Operator Login</h2>
        <p>Abu Dhabi Real Estate Centre Registry</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required />
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required />
        </div>
        <div class="error-msg" id="loginError" style="display: none; margin-top: 15px;">Invalid username or password</div>
        <button type="submit" class="btn-login" style="margin-top: 25px;">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');

      // If a token exists, assume logged in and redirect
      if (localStorage.getItem('admin_token')) {
        window.location.href = '/admin';
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          if (response.ok) {
            const data = await response.json();
            localStorage.setItem('admin_token', data.token);
            window.location.href = '/admin';
          } else {
            loginError.style.display = 'block';
          }
        } catch (err) {
          console.error(err);
          loginError.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
